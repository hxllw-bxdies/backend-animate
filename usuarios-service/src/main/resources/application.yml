# Configuración común. Los valores ${VARIABLE:defecto} se pueden cambiar con variables de entorno.
server:
  port: ${PORT:8081}
spring:
  application:
    name: usuarios
  profiles:
    # h2 = base en archivo local (sin instalar nada). mysql = Docker o MySQL local.
    default: h2
  jpa:
    open-in-view: false
    hibernate:
      # Hibernate crea/actualiza las tablas a partir de las clases @Entity.
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  issuer: ${JWT_ISSUER:animate-usuarios}
  gateway-url: ${GATEWAY_URL:http://localhost:8080}
  allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  admin-password: ${ADMIN_PASSWORD:AdminAnimate#1}
  usuario-password: ${USUARIO_PASSWORD:Carlos#Laraña1}
  keys-directory: ${KEYS_DIRECTORY:./data/keys}
  cookie-secure: ${COOKIE_SECURE:false}
  # Duración del access token (JWT) en segundos: 15 minutos.
  access-seconds: ${ACCESS_TOKEN_SECONDS:900}
